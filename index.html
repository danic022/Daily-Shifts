<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Lineup Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      overflow: hidden;
    }

    /* 3D Stage for Perspective Animations */
    .perspective-stage {
      perspective: 1200px;
    }

    /* Tile Entry & Exit Animations */
    .tile-card {
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center center;
      backface-visibility: hidden;
    }

    /* Entering animation: scale up + slide upward + subtle 3D tilt */
    .tile-enter {
      opacity: 0;
      transform: translateY(40px) scale(0.85) rotateX(15deg);
    }

    .tile-active {
      opacity: 1;
      transform: translateY(0) scale(1) rotateX(0deg);
    }

    /* Exiting animation: scale down + slide downward + tilt away */
    .tile-exit {
      opacity: 0;
      transform: translateY(-40px) scale(0.85) rotateX(-15deg);
    }

    /* Image zoom effect on card container */
    .tile-card:hover .tile-bg-photo {
      transform: scale(1.08);
    }

    .tile-bg-photo {
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Custom Scrollbar for Settings Modal */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-8 relative selection:bg-indigo-500 selection:text-white">

  <!-- TOP BAR / HEADER -->
  <header class="flex justify-between items-center z-10 mb-4">
    <div>
      <div class="flex items-center gap-3">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 id="area-title" class="text-4xl font-extrabold tracking-tight text-white drop-shadow-md">
          Main Stage
        </h1>
      </div>
      <p id="area-subtitle" class="text-slate-400 text-lg font-medium mt-1">
        Current & Upcoming Lineup
      </p>
    </div>

    <div class="flex items-center gap-4">
      <!-- Live Indicator / Timer -->
      <div class="bg-slate-900/80 border border-slate-800 backdrop-blur-md px-5 py-2.5 rounded-2xl flex items-center gap-3 shadow-lg">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Next Area In</span>
        <span id="timer-display" class="font-mono text-xl font-bold text-indigo-400">10s</span>
      </div>

      <!-- Settings Button -->
      <button id="open-settings" class="p-3 bg-slate-900/80 hover:bg-slate-800 border border-slate-800 rounded-2xl text-slate-300 hover:text-white transition-all shadow-lg active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN TILES CONTAINER (EXPANDED PHOTO CARDS) -->
  <main class="flex-1 perspective-stage flex items-center justify-center py-2">
    <div id="tiles-container" class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full h-full max-h-[720px]">
      <!-- Tiles dynamically injected here -->
    </div>
  </main>

  <!-- FOOTER NAVIGATION / AREA INDICATORS -->
  <footer class="flex justify-between items-center z-10 pt-4">
    <div id="area-dots" class="flex items-center gap-3">
      <!-- Dynamic dots for current active area -->
    </div>

    <div class="text-xs font-semibold text-slate-500 uppercase tracking-widest">
      Automated Display Node #04
    </div>
  </footer>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300" id="settings-card">
      <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
        Display Settings
      </h2>

      <div class="space-y-6">
        <!-- Transition Time Range Slider -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-semibold text-slate-300">Area Transition Delay</label>
            <span id="slider-value" class="text-sm font-mono font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">10 seconds</span>
          </div>
          <input type="range" id="transition-slider" min="3" max="30" value="10" step="1" 
            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          <div class="flex justify-between text-xs text-slate-500 mt-2 font-medium">
            <span>3s (Fast)</span>
            <span>15s</span>
            <span>30s (Slow)</span>
          </div>
        </div>

        <!-- Animation Style Info -->
        <div class="p-4 bg-slate-800/50 border border-slate-700/50 rounded-2xl">
          <p class="text-xs text-slate-400 leading-relaxed">
            <strong class="text-slate-200">Enhanced Photo Mode:</strong> Tiles automatically scale up to fill space, utilizing high-contrast photo overlays and staggered 3D entering & exiting transitions.
          </p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="mt-8 flex gap-3">
        <button id="close-settings" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/30 active:scale-95">
          Save & Apply
        </button>
      </div>
    </div>
  </div>

  <script>
    // Sample Data for Display Areas and Performers
    const displayAreas = [
      {
        id: "main-stage",
        title: "Main Stage",
        subtitle: "Headliners & Evening Performances",
        items: [
          {
            name: "Aura & The Echoes",
            role: "Live Set • Electronic Synth",
            time: "08:00 PM - 09:30 PM",
            image: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=1000&q=80",
            status: "NEXT UP"
          },
          {
            name: "Neon Horizon",
            role: "Headliner • Cyber-Pop",
            time: "10:00 PM - 11:45 PM",
            image: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=1000&q=80",
            status: "FEATURED"
          },
          {
            name: "Solaris Duo",
            role: "Closing Set • Ambient Beats",
            time: "12:00 AM - 01:30 AM",
            image: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1000&q=80",
            status: "LATE NIGHT"
          }
        ]
      },
      {
        id: "acoustic-lounge",
        title: "Acoustic Lounge",
        subtitle: "Intimate Unplugged Sessions",
        items: [
          {
            name: "Elena Rostova",
            role: "Solo Cello & Vocals",
            time: "07:30 PM - 08:30 PM",
            image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1000&q=80",
            status: "LIVE NOW"
          },
          {
            name: "The Timber Collective",
            role: "Folk & Acoustic Quartet",
            time: "09:00 PM - 10:15 PM",
            image: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&w=1000&q=80",
            status: "NEXT UP"
          },
          {
            name: "Marcus Vance",
            role: "Classical Guitar",
            time: "10:45 PM - 11:30 PM",
            image: "https://images.unsplash.com/photo-1510915361894-db8b60106cb1?auto=format&fit=crop&w=1000&q=80",
            status: "UPCOMING"
          }
        ]
      },
      {
        id: "club-dome",
        title: "The Dynamic Dome",
        subtitle: "High Energy Visuals & Bass",
        items: [
          {
            name: "KAIRO",
            role: "Deep House & Techno",
            time: "09:00 PM - 11:00 PM",
            image: "https://images.unsplash.com/photo-1574391884720-bbc3740c59d1?auto=format&fit=crop&w=1000&q=80",
            status: "LIVE NOW"
          },
          {
            name: "Valkyrie",
            role: "Drum & Bass Showcase",
            time: "11:00 PM - 01:00 AM",
            image: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=1000&q=80",
            status: "NEXT UP"
          },
          {
            name: "SubZero",
            role: "Dubstep / Visual Experience",
            time: "01:00 AM - 03:00 AM",
            image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1000&q=80",
            status: "LATE NIGHT"
          }
        ]
      }
    ];

    // State Variables
    let currentAreaIndex = 0;
    let transitionDelay = 10; // in seconds
    let secondsRemaining = transitionDelay;
    let timerInterval = null;

    // DOM Elements
    const tilesContainer = document.getElementById('tiles-container');
    const areaTitle = document.getElementById('area-title');
    const areaSubtitle = document.getElementById('area-subtitle');
    const timerDisplay = document.getElementById('timer-display');
    const areaDotsContainer = document.getElementById('area-dots');
    
    // Modal Elements
    const settingsModal = document.getElementById('settings-modal');
    const settingsCard = document.getElementById('settings-card');
    const openSettingsBtn = document.getElementById('open-settings');
    const closeSettingsBtn = document.getElementById('close-settings');
    const transitionSlider = document.getElementById('transition-slider');
    const sliderValueDisplay = document.getElementById('slider-value');

    // Render Navigation Dots
    function renderDots() {
      areaDotsContainer.innerHTML = displayAreas.map((area, idx) => `
        <div class="flex items-center gap-2">
          <div class="h-2.5 rounded-full transition-all duration-500 ${idx === currentAreaIndex ? 'w-8 bg-indigo-500' : 'w-2.5 bg-slate-800'}"></div>
        </div>
      `).join('');
    }

    // Render Tiles with Enhanced Visual Focus and Animation Classes
    function renderArea(index) {
      const area = displayAreas[index];
      areaTitle.textContent = area.title;
      areaSubtitle.textContent = area.subtitle;
      renderDots();

      // Clear existing content
      tilesContainer.innerHTML = '';

      // Generate Card HTML with Edge-to-Edge Photo Focus
      area.items.forEach((item, idx) => {
        const tile = document.createElement('div');
        tile.className = `tile-card tile-enter relative rounded-3xl overflow-hidden border border-slate-800/80 bg-slate-900 shadow-2xl flex flex-col justify-end group cursor-pointer`;
        tile.style.transitionDelay = `${idx * 120}ms`; // Staggered entry animation delay

        tile.innerHTML = `
          <!-- Full Card Background Image -->
          <div class="absolute inset-0 z-0 overflow-hidden">
            <img src="${item.image}" alt="${item.name}" class="tile-bg-photo w-full h-full object-cover object-center filter brightness-90 contrast-105">
            <!-- Gradient Overlay for Contrast & Text Legibility -->
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
          </div>

          <!-- Top Badge / Status -->
          <div class="absolute top-5 left-5 z-10 flex gap-2">
            <span class="px-3.5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-slate-950/60 backdrop-blur-md border border-white/10 text-indigo-300 shadow-md">
              ${item.status}
            </span>
          </div>

          <!-- Bottom Card Content -->
          <div class="relative z-10 p-6 flex flex-col justify-end">
            <span class="text-sm font-semibold text-indigo-400 mb-1 flex items-center gap-1.5">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              ${item.time}
            </span>
            <h3 class="text-2xl font-extrabold text-white tracking-tight leading-tight group-hover:text-indigo-200 transition-colors">
              ${item.name}
            </h3>
            <p class="text-sm font-medium text-slate-300/90 mt-1">
              ${item.role}
            </p>
          </div>
        `;

        tilesContainer.appendChild(tile);

        // Trigger entrance transition on next frame
        requestAnimationFrame(() => {
          setTimeout(() => {
            tile.classList.remove('tile-enter');
            tile.classList.add('tile-active');
          }, 50);
        });
      });
    }

    // Transition to Next Area with Smooth Exit Animation
    function nextArea() {
      const activeTiles = tilesContainer.querySelectorAll('.tile-card');
      
      // Apply exit animations with reverse staggering
      activeTiles.forEach((tile, idx) => {
        setTimeout(() => {
          tile.classList.remove('tile-active');
          tile.classList.add('tile-exit');
        }, (activeTiles.length - 1 - idx) * 80);
      });

      // Wait for exit animation to complete before rendering new area
      setTimeout(() => {
        currentAreaIndex = (currentAreaIndex + 1) % displayAreas.length;
        renderArea(currentAreaIndex);
        resetTimer();
      }, 600);
    }

    // Timer Logic
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsRemaining--;
        timerDisplay.textContent = `${secondsRemaining}s`;

        if (secondsRemaining <= 0) {
          nextArea();
        }
      }, 1000);
    }

    function resetTimer() {
      secondsRemaining = transitionDelay;
      timerDisplay.textContent = `${secondsRemaining}s`;
    }

    // Settings Modal Controllers
    openSettingsBtn.addEventListener('click', () => {
      settingsModal.classList.remove('opacity-0', 'pointer-events-none');
      settingsCard.classList.remove('scale-95');
      settingsCard.classList.add('scale-100');
    });

    closeSettingsBtn.addEventListener('click', () => {
      // Save setting value
      transitionDelay = parseInt(transitionSlider.value, 10);
      resetTimer();

      // Close modal
      settingsModal.classList.add('opacity-0', 'pointer-events-none');
      settingsCard.classList.remove('scale-100');
      settingsCard.classList.add('scale-95');
    });

    transitionSlider.addEventListener('input', (e) => {
      sliderValueDisplay.textContent = `${e.target.value} seconds`;
    });

    // Initialize Page
    renderArea(currentAreaIndex);
    startTimer();
  </script>
</body>
</html>
