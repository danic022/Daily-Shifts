<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift & Area Display Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      overflow: hidden;
    }

    /* 3D Stage for Card Transitions */
    .perspective-stage {
      perspective: 1200px;
    }

    /* Tile Animations */
    .tile-card {
      transition: all 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center center;
      backface-visibility: hidden;
    }

    /* Entrance Transition */
    .tile-enter {
      opacity: 0;
      transform: translateY(40px) scale(0.88) rotateX(12deg);
    }

    .tile-active {
      opacity: 1;
      transform: translateY(0) scale(1) rotateX(0deg);
    }

    /* Exit Transition */
    .tile-exit {
      opacity: 0;
      transform: translateY(-40px) scale(0.88) rotateX(-12deg);
    }

    /* Ambient Zoom on Hover */
    .tile-card:hover .tile-bg-photo {
      transform: scale(1.08);
    }

    .tile-bg-photo {
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-8 relative selection:bg-indigo-500 selection:text-white">

  <!-- TOP BAR / HEADER -->
  <header class="flex justify-between items-center z-10 mb-4">
    <div>
      <div class="flex items-center gap-3">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 id="area-title" class="text-4xl font-extrabold tracking-tight text-white drop-shadow-md">
          Main Hall
        </h1>
      </div>
      <p id="area-subtitle" class="text-slate-400 text-lg font-medium mt-1">
        Current Shift Roster & Staff Assignments
      </p>
    </div>

    <div class="flex items-center gap-4">
      <!-- Live Area Countdown Indicator -->
      <div class="bg-slate-900/90 border border-slate-800 backdrop-blur-md px-5 py-2.5 rounded-2xl flex items-center gap-3 shadow-lg">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Next Area In</span>
        <span id="timer-display" class="font-mono text-xl font-bold text-indigo-400">10s</span>
      </div>

      <!-- Settings Trigger Button -->
      <button id="open-settings" class="p-3 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 rounded-2xl text-slate-300 hover:text-white transition-all shadow-lg active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN TILES CONTAINER -->
  <main class="flex-1 perspective-stage flex items-center justify-center py-2">
    <div id="tiles-container" class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full h-full max-h-[720px]">
      <!-- Cards rendered here dynamically -->
    </div>
  </main>

  <!-- FOOTER NAVIGATION & AREA DOTS -->
  <footer class="flex justify-between items-center z-10 pt-4">
    <div id="area-dots" class="flex items-center gap-3">
      <!-- Area indicators populated by JS -->
    </div>

    <div class="text-xs font-semibold text-slate-500 uppercase tracking-widest">
      Shift Lineup Display System
    </div>
  </footer>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300" id="settings-card">
      <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
        Display Options
      </h2>

      <div class="space-y-6">
        <!-- Transition Time Range Slider -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-semibold text-slate-300">Area Transition Delay</label>
            <span id="slider-value" class="text-sm font-mono font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">10 seconds</span>
          </div>
          <input type="range" id="transition-slider" min="3" max="30" value="10" step="1" 
            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          <div class="flex justify-between text-xs text-slate-500 mt-2 font-medium">
            <span>3s (Fast)</span>
            <span>15s</span>
            <span>30s (Slow)</span>
          </div>
        </div>

        <div class="p-4 bg-slate-800/50 border border-slate-700/50 rounded-2xl">
          <p class="text-xs text-slate-400 leading-relaxed">
            <strong class="text-slate-200">Shift View Active:</strong> Displays Leader, Coordinator, and Team Member details with photo background focus and dynamic entrance animations.
          </p>
        </div>
      </div>

      <div class="mt-8 flex gap-3">
        <button id="close-settings" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/30 active:scale-95">
          Save & Apply
        </button>
      </div>
    </div>
  </div>

  <script>
    // Shift Data with Leaders, Coordinators, and Staff
    const displayAreas = [
      {
        id: "main-hall",
        title: "Main Hall",
        subtitle: "Morning Shift • Operational Operations",
        items: [
          {
            name: "Sarah Jenkins",
            role: "Shift Leader",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "David Miller",
            team: "Team Alpha (8 Members)",
            image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=1000&q=80",
            status: "ON DUTY"
          },
          {
            name: "Marcus Vance",
            role: "Floor Coordinator",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "Sarah Jenkins",
            team: "Logistics & Support",
            image: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=1000&q=80",
            status: "ACTIVE"
          },
          {
            name: "Elena Rostova",
            role: "Safety & Quality Lead",
            shiftTime: "08:00 AM - 04:30 PM",
            coordinator: "Sarah Jenkins",
            team: "Inspection Crew B",
            image: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=1000&q=80",
            status: "ON SITE"
          }
        ]
      },
      {
        id: "logistics-hub",
        title: "Logistics Hub",
        subtitle: "Inbound & Outbound Dispatch",
        items: [
          {
            name: "Alex Rivera",
            role: "Shift Leader",
            shiftTime: "06:00 AM - 02:30 PM",
            coordinator: "Rachel Green",
            team: "Dock Operations",
            image: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=1000&q=80",
            status: "ON DUTY"
          },
          {
            name: "Jessica Chen",
            role: "Inventory Coordinator",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "Alex Rivera",
            team: "Warehouse Team 3",
            image: "https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&w=1000&q=80",
            status: "ACTIVE"
          },
          {
            name: "James Wilson",
            role: "Transport Specialist",
            shiftTime: "08:00 AM - 04:30 PM",
            coordinator: "Alex Rivera",
            team: "Fleet Dispatch",
            image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1000&q=80",
            status: "ON ROUTE"
          }
        ]
      },
      {
        id: "control-center",
        title: "Control Center",
        subtitle: "Monitoring & Technical Support",
        items: [
          {
            name: "David Kim",
            role: "Systems Lead",
            shiftTime: "08:00 AM - 05:00 PM",
            coordinator: "Amanda Lewis",
            team: "Network Reliability",
            image: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=1000&q=80",
            status: "ON DUTY"
          },
          {
            name: "Taylor Swift",
            role: "Incident Coordinator",
            shiftTime: "08:00 AM - 05:00 PM",
            coordinator: "David Kim",
            team: "Response Team Alpha",
            image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80",
            status: "STANDBY"
          },
          {
            name: "Robert Taylor",
            role: "Security Supervisor",
            shiftTime: "07:00 AM - 04:00 PM",
            coordinator: "David Kim",
            team: "Facility Security",
            image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1000&q=80",
            status: "ACTIVE"
          }
        ]
      }
    ];

    // State
    let currentAreaIndex = 0;
    let transitionDelay = 10;
    let secondsRemaining = transitionDelay;
    let timerInterval = null;

    // DOM Elements
    const tilesContainer = document.getElementById('tiles-container');
    const areaTitle = document.getElementById('area-title');
    const areaSubtitle = document.getElementById('area-subtitle');
    const timerDisplay = document.getElementById('timer-display');
    const areaDotsContainer = document.getElementById('area-dots');
    
    // Modal Elements
    const settingsModal = document.getElementById('settings-modal');
    const settingsCard = document.getElementById('settings-card');
    const openSettingsBtn = document.getElementById('open-settings');
    const closeSettingsBtn = document.getElementById('close-settings');
    const transitionSlider = document.getElementById('transition-slider');
    const sliderValueDisplay = document.getElementById('slider-value');

    // Render Navigation Dots
    function renderDots() {
      areaDotsContainer.innerHTML = displayAreas.map((_, idx) => `
        <div class="h-2.5 rounded-full transition-all duration-500 ${idx === currentAreaIndex ? 'w-8 bg-indigo-500' : 'w-2.5 bg-slate-800'}"></div>
      `).join('');
    }

    // Render Area Cards (Full Photo Focus + Restored Shift Meta)
    function renderArea(index) {
      const area = displayAreas[index];
      areaTitle.textContent = area.title;
      areaSubtitle.textContent = area.subtitle;
      renderDots();

      tilesContainer.innerHTML = '';

      area.items.forEach((item, idx) => {
        const tile = document.createElement('div');
        tile.className = `tile-card tile-enter relative rounded-3xl overflow-hidden border border-slate-800/80 bg-slate-900 shadow-2xl flex flex-col justify-between group cursor-pointer p-6`;
        tile.style.transitionDelay = `${idx * 120}ms`;

        tile.innerHTML = `
          <!-- Photo Background with Gradient -->
          <div class="absolute inset-0 z-0 overflow-hidden">
            <img src="${item.image}" alt="${item.name}" class="tile-bg-photo w-full h-full object-cover object-center filter brightness-[0.85] contrast-105">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/70 to-slate-950/20"></div>
          </div>

          <!-- Top Status Badge & Role -->
          <div class="relative z-10 flex justify-between items-start">
            <span class="px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider bg-indigo-600/80 backdrop-blur-md border border-indigo-400/30 text-white shadow-md">
              ${item.role}
            </span>
            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-slate-950/60 backdrop-blur-md border border-white/10 text-emerald-400 shadow-md">
              ${item.status}
            </span>
          </div>

          <!-- Restored Shift & Leader Details (Bottom Area) -->
          <div class="relative z-10 mt-auto">
            <h3 class="text-3xl font-extrabold text-white tracking-tight leading-tight mb-2">
              ${item.name}
            </h3>

            <!-- Shift Details Grid -->
            <div class="space-y-1.5 pt-3 border-t border-white/15">
              <div class="flex items-center gap-2 text-xs font-medium text-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span><strong>Shift:</strong> ${item.shiftTime}</span>
              </div>

              <div class="flex items-center gap-2 text-xs font-medium text-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span><strong>Coordinator:</strong> ${item.coordinator}</span>
              </div>

              <div class="flex items-center gap-2 text-xs font-medium text-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span><strong>Team:</strong> ${item.team}</span>
              </div>
            </div>
          </div>
        `;

        tilesContainer.appendChild(tile);

        requestAnimationFrame(() => {
          setTimeout(() => {
            tile.classList.remove('tile-enter');
            tile.classList.add('tile-active');
          }, 50);
        });
      });
    }

    // Next Area Transition
    function nextArea() {
      const activeTiles = tilesContainer.querySelectorAll('.tile-card');
      
      activeTiles.forEach((tile, idx) => {
        setTimeout(() => {
          tile.classList.remove('tile-active');
          tile.classList.add('tile-exit');
        }, (activeTiles.length - 1 - idx) * 80);
      });

      setTimeout(() => {
        currentAreaIndex = (currentAreaIndex + 1) % displayAreas.length;
        renderArea(currentAreaIndex);
        resetTimer();
      }, 550);
    }

    // Timer Controls
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsRemaining--;
        timerDisplay.textContent = `${secondsRemaining}s`;

        if (secondsRemaining <= 0) {
          nextArea();
        }
      }, 1000);
    }

    function resetTimer() {
      secondsRemaining = transitionDelay;
      timerDisplay.textContent = `${secondsRemaining}s`;
    }

    // Settings Modal
    openSettingsBtn.addEventListener('click', () => {
      settingsModal.classList.remove('opacity-0', 'pointer-events-none');
      settingsCard.classList.remove('scale-95');
      settingsCard.classList.add('scale-100');
    });

    closeSettingsBtn.addEventListener('click', () => {
      transitionDelay = parseInt(transitionSlider.value, 10);
      resetTimer();

      settingsModal.classList.add('opacity-0', 'pointer-events-none');
      settingsCard.classList.remove('scale-100');
      settingsCard.classList.add('scale-95');
    });

    transitionSlider.addEventListener('input', (e) => {
      sliderValueDisplay.textContent = `${e.target.value} seconds`;
    });

    // Init
    renderArea(currentAreaIndex);
    startTimer();
  </script>
</body>
</html>
