<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift & Operational Area Display Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    .tile-card {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tile-enter {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
    }

    .tile-active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .tile-exit {
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-8 relative selection:bg-indigo-500 selection:text-white">

  <!-- TOP BAR / HEADER -->
  <header class="flex justify-between items-center z-10 mb-4">
    <div>
      <div class="flex items-center gap-3">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 id="area-title" class="text-4xl font-extrabold tracking-tight text-white drop-shadow-md">
          Area 50
        </h1>
      </div>
      <p id="area-subtitle" class="text-slate-400 text-lg font-medium mt-1">
        Current Shift Roster & Staff Assignments
      </p>
    </div>

    <div class="flex items-center gap-4">
      <div class="bg-slate-900/90 border border-slate-800 backdrop-blur-md px-5 py-2.5 rounded-2xl flex items-center gap-3 shadow-lg">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Next Area In</span>
        <span id="timer-display" class="font-mono text-xl font-bold text-indigo-400">10s</span>
      </div>

      <button id="open-settings" class="p-3 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 rounded-2xl text-slate-300 hover:text-white transition-all shadow-lg active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN TILES CONTAINER -->
  <main class="flex-1 flex items-center justify-center py-2">
    <div id="tiles-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full h-full max-h-[720px]">
      <!-- Cards rendered dynamically -->
    </div>
  </main>

  <!-- FOOTER NAVIGATION & AREA DOTS -->
  <footer class="flex justify-between items-center z-10 pt-4">
    <div id="area-dots" class="flex items-center gap-3">
      <!-- Indicators dynamically populated -->
    </div>

    <div class="text-xs font-semibold text-slate-500 uppercase tracking-widest">
      Shift Lineup Display System
    </div>
  </footer>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300" id="settings-card">
      <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
        Display Options
      </h2>

      <div class="space-y-6">
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-semibold text-slate-300">Area Transition Delay</label>
            <span id="slider-value" class="text-sm font-mono font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">10 seconds</span>
          </div>
          <input type="range" id="transition-slider" min="3" max="30" value="10" step="1" 
            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          <div class="flex justify-between text-xs text-slate-500 mt-2 font-medium">
            <span>3s (Fast)</span>
            <span>15s</span>
            <span>30s (Slow)</span>
          </div>
        </div>
      </div>

      <div class="mt-8 flex gap-3">
        <button id="close-settings" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/30 active:scale-95">
          Save & Apply
        </button>
      </div>
    </div>
  </div>

  <script>
    const displayAreas = [
      {
        id: "area-50",
        title: "Area 50",
        subtitle: "Main Processing & Assembly Line",
        items: [
          {
            name: "Sarah Jenkins",
            role: "Shift Leader",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "David Miller",
            team: "Alpha Crew (Area 50)",
            image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80",
            status: "ON DUTY"
          },
          {
            name: "Marcus Vance",
            role: "Area Coordinator",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "Sarah Jenkins",
            team: "Line 50 Operations",
            image: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=300&q=80",
            status: "ACTIVE"
          },
          {
            name: "Elena Rostova",
            role: "Safety Lead",
            shiftTime: "08:00 AM - 04:30 PM",
            coordinator: "Sarah Jenkins",
            team: "Area 50 Quality Control",
            image: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=300&q=80",
            status: "ON SITE"
          }
        ]
      },
      {
        id: "area-60",
        title: "Area 60",
        subtitle: "Manufacturing & Heavy Operations",
        items: [
          {
            name: "Michael Chang",
            role: "Shift Leader",
            shiftTime: "06:30 AM - 03:00 PM",
            coordinator: "Rachel Green",
            team: "Beta Operations",
            image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80",
            status: "ON DUTY"
          },
          {
            name: "Jessica Chen",
            role: "Area Coordinator",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "Michael Chang",
            team: "Line 60 Production",
            image: "https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&w=300&q=80",
            status: "ACTIVE"
          },
          {
            name: "Tom Bradley",
            role: "Maintenance Specialist",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "Michael Chang",
            team: "Area 60 Tech Support",
            image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80",
            status: "ACTIVE"
          }
        ]
      },
      {
        id: "area-80",
        title: "Area 80",
        subtitle: "Final Quality Assurance & Testing",
        items: [
          {
            name: "Amanda Lewis",
            role: "Shift Leader",
            shiftTime: "08:00 AM - 04:30 PM",
            coordinator: "Robert Taylor",
            team: "QA Operations",
            image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
            status: "ON DUTY"
          },
          {
            name: "David Kim",
            role: "Area Coordinator",
            shiftTime: "08:00 AM - 04:30 PM",
            coordinator: "Amanda Lewis",
            team: "Testing Protocol 80",
            image: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=300&q=80",
            status: "ACTIVE"
          },
          {
            name: "Karen White",
            role: "Inspection Lead",
            shiftTime: "08:00 AM - 04:30 PM",
            coordinator: "Amanda Lewis",
            team: "Area 80 Audit Team",
            image: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80",
            status: "ON SITE"
          }
        ]
      },
      {
        id: "base",
        title: "Base Operations",
        subtitle: "Central Logistics & Supply Management",
        items: [
          {
            name: "Alex Rivera",
            role: "Shift Leader",
            shiftTime: "06:00 AM - 02:30 PM",
            coordinator: "Carlos Gomez",
            team: "Base Logistics",
            image: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=300&q=80",
            status: "ON DUTY"
          },
          {
            name: "Linda Thorne",
            role: "Inventory Coordinator",
            shiftTime: "06:30 AM - 03:00 PM",
            coordinator: "Alex Rivera",
            team: "Supply Line Alpha",
            image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80",
            status: "ACTIVE"
          },
          {
            name: "Jason Hayes",
            role: "Dispatch Lead",
            shiftTime: "07:00 AM - 03:30 PM",
            coordinator: "Alex Rivera",
            team: "Base Receiving",
            image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=300&q=80",
            status: "ACTIVE"
          }
        ]
      },
      {
        id: "deployment",
        title: "Deployment Zone",
        subtitle: "Outbound Logistics & Field Staging",
        items: [
          {
            name: "Robert Taylor",
            role: "Shift Leader",
            shiftTime: "07:00 AM - 04:00 PM",
            coordinator: "Alex Rivera",
            team: "Deployment Command",
            image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80",
            status: "ON DUTY"
          },
          {
            name: "Samantha Reed",
            role: "Staging Coordinator",
            shiftTime: "07:30 AM - 04:00 PM",
            coordinator: "Robert Taylor",
            team: "Field Logistics Crew",
            image: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=300&q=80",
            status: "ACTIVE"
          },
          {
            name: "Chris Martinez",
            role: "Transport Lead",
            shiftTime: "08:00 AM - 04:30 PM",
            coordinator: "Robert Taylor",
            team: "Deployment Fleet 1",
            image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80",
            status: "DEPLOYED"
          }
        ]
      }
    ];

    let currentAreaIndex = 0;
    let transitionDelay = 10;
    let secondsRemaining = transitionDelay;
    let timerInterval = null;

    const tilesContainer = document.getElementById('tiles-container');
    const areaTitle = document.getElementById('area-title');
    const areaSubtitle = document.getElementById('area-subtitle');
    const timerDisplay = document.getElementById('timer-display');
    const areaDotsContainer = document.getElementById('area-dots');
    
    const settingsModal = document.getElementById('settings-modal');
    const settingsCard = document.getElementById('settings-card');
    const openSettingsBtn = document.getElementById('open-settings');
    const closeSettingsBtn = document.getElementById('close-settings');
    const transitionSlider = document.getElementById('transition-slider');
    const sliderValueDisplay = document.getElementById('slider-value');

    function renderDots() {
      areaDotsContainer.innerHTML = displayAreas.map((_, idx) => `
        <div class="h-2.5 rounded-full transition-all duration-500 ${idx === currentAreaIndex ? 'w-8 bg-indigo-500' : 'w-2.5 bg-slate-800'}"></div>
      `).join('');
    }

    function renderArea(index) {
      const area = displayAreas[index];
      areaTitle.textContent = area.title;
      areaSubtitle.textContent = area.subtitle;
      renderDots();

      tilesContainer.innerHTML = '';

      area.items.forEach((item, idx) => {
        const tile = document.createElement('div');
        tile.className = `tile-card tile-enter bg-slate-900/80 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between shadow-xl backdrop-blur-md relative overflow-hidden`;
        tile.style.transitionDelay = `${idx * 100}ms`;

        tile.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-500/10 border border-indigo-500/20 text-indigo-400">
                ${item.role}
              </span>
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                ${item.status}
              </span>
            </div>

            <div class="flex items-center gap-4 mb-6">
              <img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-2xl object-cover border-2 border-slate-700 shadow-md">
              <div>
                <h3 class="text-2xl font-bold text-white tracking-tight">${item.name}</h3>
                <p class="text-sm text-slate-400 font-medium">${item.team}</p>
              </div>
            </div>
          </div>

          <div class="space-y-3 pt-4 border-t border-slate-800/80 text-sm">
            <div class="flex justify-between items-center text-slate-300">
              <span class="text-slate-500 font-medium">Shift Hours</span>
              <span class="font-semibold text-slate-200">${item.shiftTime}</span>
            </div>
            <div class="flex justify-between items-center text-slate-300">
              <span class="text-slate-500 font-medium">Coordinator</span>
              <span class="font-semibold text-slate-200">${item.coordinator}</span>
            </div>
          </div>
        `;

        tilesContainer.appendChild(tile);

        requestAnimationFrame(() => {
          setTimeout(() => {
            tile.classList.remove('tile-enter');
            tile.classList.add('tile-active');
          }, 50);
        });
      });
    }

    function nextArea() {
      const activeTiles = tilesContainer.querySelectorAll('.tile-card');
      
      activeTiles.forEach((tile, idx) => {
        setTimeout(() => {
          tile.classList.remove('tile-active');
          tile.classList.add('tile-exit');
        }, idx * 60);
      });

      setTimeout(() => {
        currentAreaIndex = (currentAreaIndex + 1) % displayAreas.length;
        renderArea(currentAreaIndex);
        resetTimer();
      }, 400);
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsRemaining--;
        timerDisplay.textContent = `${secondsRemaining}s`;

        if (secondsRemaining <= 0) {
          nextArea();
        }
      }, 1000);
    }

    function resetTimer() {
      secondsRemaining = transitionDelay;
      timerDisplay.textContent = `${secondsRemaining}s`;
    }

    openSettingsBtn.addEventListener('click', () => {
      settingsModal.classList.remove('opacity-0', 'pointer-events-none');
      settingsCard.classList.remove('scale-95');
      settingsCard.classList.add('scale-100');
    });

    closeSettingsBtn.addEventListener('click', () => {
      transitionDelay = parseInt(transitionSlider.value, 10);
      resetTimer();

      settingsModal.classList.add('opacity-0', 'pointer-events-none');
      settingsCard.classList.remove('scale-100');
      settingsCard.classList.add('scale-95');
    });

    transitionSlider.addEventListener('input', (e) => {
      sliderValueDisplay.textContent = `${e.target.value} seconds`;
    });

    renderArea(currentAreaIndex);
    startTimer();
  </script>
</body>
</html>
